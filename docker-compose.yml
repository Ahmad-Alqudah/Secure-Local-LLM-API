services:
  secure-llm-api:
    build: .
    container_name: secure-llm-api

    ports:
      - "8005:8000"

    environment:
      API_KEY: ${API_KEY}
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      MODEL_NAME: qwen2.5:0.5b

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped